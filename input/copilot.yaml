# Copilot de candidature (.\apply.ps1)

# Nom des fichiers déposés dans le dossier d'upload : CV_<file_name>.pdf et
# LM_<file_name>.pdf (toujours les mêmes noms, contenu de l'offre en cours).
file_name: Jean_Martini

# Dossier d'upload (chemin relatif à la racine du repo). Sa fenêtre
# d'Explorateur reste ouverte au même endroit pendant toute la session.
staging_dir: output/copilot/a_uploader

# Disposition : navigateur = moitié gauche, Explorateur = quart haut droit,
# tableau de bord d'avancement = quart bas droit. Part de la largeur d'écran
# pour le navigateur, et part de la hauteur pour l'Explorateur.
browser_width_ratio: 0.5
explorer_height_ratio: 0.5

# Programme local du pré-remplissage (fill.py) : port d'écoute sur 127.0.0.1.
# Doit rester identique à PORT dans extension/background.js.
fill_server_port: 47321

# Sites où le pré-remplissage est désactivé (conditions d'utilisation).
fill_excluded_domains:
  - linkedin.com

# Tes infos perso pour les formulaires (adresse, salaire, préavis...) : input/form_profile.yaml
# (local, ignoré par git, jamais dans le CV ni la LM). Modèle : input/form_profile.example.yaml.
